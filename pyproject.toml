[project]
name = "songforge"
version = "0.1.0"
description = "Local Suno-style song studio for Apple Silicon. Lyrics and a style prompt become a full song with vocals, through YuE2 and MLX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur", email = "levi74108520963@gmail.com" }]
requires-python = ">=3.12"
keywords = ["music-generation", "yue2", "mlx", "apple-silicon", "suno", "song", "text-to-music", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/Arthur031221/songforge"
Demo = "https://arthur031221.github.io/songforge/"
Issues = "https://github.com/Arthur031221/songforge/issues"
Changelog = "https://github.com/Arthur031221/songforge/blob/main/CHANGELOG.md"

[project.scripts]
songforge = "songforge.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
